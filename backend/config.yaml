model:
  confidence: 0.20
  image_size: 1280
  path: runs/detect/train5/weights/ball_best.pt
  tracker: bytetrack
physics:
  hit_angle_threshold: 35
  speed_range:
  - 80
  - 160
  spin_multiplier: 0.4
  swing_multiplier: 0.2
bowling_speed:
  global_min_kmh: 70
  global_max_kmh: 160
  tiers:
  - id: medium
    label: Medium Pace
    avg_min: 80
    avg_max: 120
    max_speed: 140
  - id: fast_medium
    label: Fast Medium
    avg_min: 120
    avg_max: 150
    max_speed: 160
  - id: fast
    label: Fast Bowling
    avg_min: 130
    avg_max: 160
    max_speed: 160
processing:
  ffmpeg_path: ffmpeg
  max_file_size_mb: 500
  clip_by_clip: false
  clip_mode: stream
  stream_detect_every_frame: true
  clip_scan_stride: 2
  clip_start_padding: 15
  clip_end_padding: 50
  clip_lost_sec: 1.15
  clip_scan_conf: 0.08
  waiting_conf: 0.12
  ball_color_skip_conf: 0.12
  # Track ball from release through flight (not only near batsman / not ground clutter)
  track_delivery_in_flight: true
  reject_ground_resting_ball: true
  reject_metallic_hardware: true
  require_ball_color_for_lock: false
  detect_pitch_area_only: true
  pitch_flight_margin_px: 110
  machine_release_zone:
    enabled: true
    x_min_ratio: 0.50
    x_max_ratio: 0.90
    y_min_ratio: 0.18
    y_max_ratio: 0.76
  ground_resting_y_offset: 0.06
  ground_resting_y_min_landscape: 0.82
  ground_resting_y_min_portrait: 0.78
  clip_deep_imgsz: 1280
  ball_approach_y_min: 0.55
  ball_approach_y_min_landscape: 0.30
  ball_approach_y_min_after_contact: 0.28
  # Bounce near batsman — frame ke is % se neeche hona chahiye (long flight air reject)
  bounce_ground_y_min: 0.65
  bounce_ground_y_min_landscape: 0.72
  bounce_min_track_frames: 26
  bounce_lookback_frames: 40
  bounce_min_descent_frames: 5
  bounce_min_fall_ratio: 0.12
  bounce_min_rise_px: 16
  bounce_skip_release_ratio: 0.35
  bounce_min_along_ratio: 0.40
  bounce_min_seconds_after_lock: 0.38
  bounce_min_dist_from_lock_ratio: 0.12
  bounce_predict_min_frames: 6
  bounce_refine_enabled: false
  # Ball bbox size scales with resolution (ref: 478x850 portrait)
  ball_size_ref_height: 850
  ball_min_area: 25
  ball_max_area: 550
  # Handheld / shaky video: auto turns on when median shake exceeds threshold
  stabilization:
    mode: always          # auto | always | off
    smooth: 0.90        # higher = smoother, more lag on intentional pan
    max_shift_ratio: 0.07
    max_rotate_deg: 3.5
    shake_enable_px: 2.8
    probe_frames: 24
    downsample: 480
  supported_formats:
  - .mp4
  - .avi
  - .mov
  - .mkv
  - .webm
  - .m4v
tracking:
  lost_threshold: 5
  max_queue_size: 120
  max_skip_frames: 10
  stride: 1
  coast_seconds: 0.40
  kalman:
    process_noise_pos: 0.12
    process_noise_vel: 0.90
    measurement_noise: 0.035
    max_gate_px: 220
pitch:
  length_m: 20.12
  width_m: 3.05
  stump_width_m: 0.2286
  calibration_samples: 30
  prefer_manual_calibration: true
  homography_blend_fallback: 0.08
  landscape_quad:
    top_y_ratio: 0.40
    bot_y_ratio: 0.88
    left_x_ratio: 0.16
    right_x_ratio: 0.56
    bot_spread_ratio: 0.05
visualization:
  show_heatmap: true
  show_predictions: false
  trail_length: 0
  show_trajectory_lines: false
  show_corner_pitch_map: false
  show_summary_pitch_map: false
  show_pitch_zone_overlay: false
database:
  url: sqlite:///cricket_analytics.db
redis:
  url: redis://localhost:6379/0
gpu:
  require_cuda: false
  device_id: 0
  half_precision: true
  cudnn_benchmark: true
  allow_tf32: true
  fuse_layers: true
  memory_fraction: 0.85
  warmup_imgsz: 640
  waiting_imgsz: 1280
  waiting_max_dim: 1280
  waiting_stride: 1
  active_imgsz: 1280
  active_max_dim: 1280
  nvenc: true
  enable_pose: true
  calibration_samples: 30
  summary_seconds: 1
delivery_filter:
  min_track_frames: 6
  min_track_frames_strict: 8
  min_y_travel_ratio: 0.08
  min_delivery_gap_sec: 0.80
  min_new_detection_conf: 0.15
  absurd_speed_kmh: 500
  min_frames_between_markers: 14
  min_lock_frames: 2
  min_lock_travel_px: 10
  min_lock_dy_px: 6
  pending_clear_sec: 0.65
  static_reject_px: 6
  static_track_frames: 4
